server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Backend API — proxy the whole surface, including the bare /api root
    # (no trailing slash) so it never falls through to the SPA index.html.
    location ^~ /api/ {
        proxy_pass http://itip-web-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api {
        proxy_pass http://itip-web-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator — expose ONLY the health endpoint the SPA polls. Every other
    # actuator path (and the bare /actuator root) is hidden with 404 so sensitive
    # operational endpoints are never reachable through the SPA edge. The exact
    # `=` match wins over the `^~` prefix, so /actuator/health still proxies.
    location = /actuator/health {
        proxy_pass http://itip-web-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /actuator/ {
        return 404;
    }

    location = /actuator {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
