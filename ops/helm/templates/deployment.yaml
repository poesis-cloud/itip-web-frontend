{{- if .Values.deployApp }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "itip-web-frontend.fullname" . }}
  labels:
    app: {{ include "itip-web-frontend.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "itip-web-frontend.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "itip-web-frontend.fullname" . }}
      annotations:
        checksum/runtime-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/nginx-config: {{ include (print $.Template.BasePath "/nginx-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: itip-web-frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/runtime-config.js
              subPath: runtime-config.js
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: runtime-config
          configMap:
            name: {{ include "itip-web-frontend.fullname" . }}-runtime
        - name: nginx-config
          configMap:
            name: {{ include "itip-web-frontend.fullname" . }}-nginx
{{- end }}
