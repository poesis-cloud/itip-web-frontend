# Prod environment values

replicaCount: 2

deployApp: true

image:
  repository: ghcr.io/your-org/itip-web-frontend
  tag: "0.1.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  name: itip-web-frontend
  namespace: poesis

runtime:
  envName: prod
  apiBaseUrl: https://api.example.com

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

nodeSelector: {}
tolerations: []
affinity: {}
